services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthpal
      POSTGRES_USER: healthpal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthpal_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - healthpal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpal -d healthpal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthpal_dev_password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=healthpal;Username=healthpal;Password=${POSTGRES_PASSWORD:-healthpal_dev_password}
      Jwt__Issuer: HealthPal
      Jwt__Audience: HealthPal.Mobile
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-not-for-production-use!!}
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  healthpal_pg:
