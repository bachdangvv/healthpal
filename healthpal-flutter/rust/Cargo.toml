[package]
name = "healthpal_core"
version = "0.1.0"
edition = "2021"
description = "HealthPal V4 fatigue feature extraction and on-device inference"
publish = false

[lib]
name = "healthpal_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["ort-runtime"]
ort-runtime = ["dep:ort"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ort = { version = "=2.0.0-rc.11", features = ["ndarray"], optional = true }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
